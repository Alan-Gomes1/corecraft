upstream a2 {
    server a2:8000;
}

upstream a3 {
    server a3:5000;
}

server {
    listen 80;

    # ── Atividade 3 — /a3/ ──────────────────────────────────────────────────
    # proxy_pass com barra faz strip do prefixo /a3 antes de repassar ao Flask.
    location /a3/ {
        proxy_pass         http://a3/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Script-Name     /a3;
        proxy_redirect     off;
    }

    # Redireciona /a3 (sem barra) → /a3/
    location = /a3 {
        return 301 /a3/;
    }

    # ── Atividade 2 — raiz / ────────────────────────────────────────────────
    location / {
        proxy_pass         http://a2;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect     off;
    }
}
