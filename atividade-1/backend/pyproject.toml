[project]
name = "backend"
version = "0.1.0"
description = "api rpc para comunicação com a blockchain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "requests>=2.33.1",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
check_untyped_defs = false
disable_error_code = ["annotation-unchecked"]
