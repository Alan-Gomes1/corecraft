[project]
name = "corecraft"
version = "0.1.0"
description = "api rpc e zmq para comunicação com a blockchain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standart]>=0.136.1",
    "python-dotenv>=1.2.2",
    "pyzmq>=27.1.0",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
check_untyped_defs = false
disable_error_code = ["annotation-unchecked"]
